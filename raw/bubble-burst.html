<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- SEO TOÀN DIỆN -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bắn Bóng Giải Trí - Game Bắn Bóng Thư Giãn Miễn Phí Trên Web</title>
  <meta name="description" content="Chơi game bắn bóng thư giãn, xả stress miễn phí ngay trên trình duyệt. Game chơi mượt trên điện thoại và máy tính, không cần cài đặt!" />
  <meta name="keywords" content="ban bong, game ban bong, game thu gian, game mien phi, game html5, game trinh duyet" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph / SEO Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Bắn Bóng Giải Trí - Game Thư Giãn Dễ Chơi" />
  <meta property="og:description" content="Chơi ngay game nổ bóng cực đã tay, phù hợp mọi lứa tuổi!" />

  <style>
    /* RESET & RESET BROWSER DEFAULTS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }

    /* BỐ CỤC QUẢNG CÁO HEADER */
    .ad-banner-top {
      width: 100%;
      max-width: 728px;
      height: 90px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 13px;
      margin: 8px 0;
    }

    /* CONTAINER GAME TỰ ĐỘNG RESPONSIVE */
    .game-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: calc(100vh - 200px);
      max-height: 750px;
      min-height: 500px;
      background: linear-gradient(180deg, #1e1b4b 0%, #311042 100%);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.2);
      overflow: hidden;
      border: 2px solid #4c1d95;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* HUD - ĐIỂM SỐ */
    .hud {
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    .score {
      font-size: 42px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), 0 0 15px rgba(251, 191, 36, 0.4);
    }

    .best-score {
      font-size: 14px;
      color: #c084fc;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* MÀN HÌNH BẮT ĐẦU & GAME OVER */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      color: #f43f5e;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-play {
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      background: linear-gradient(135deg, #38ef7d, #11998e);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(56, 239, 125, 0.4);
      transition: transform 0.1s, filter 0.2s;
    }

    .btn-play:hover {
      filter: brightness(1.1);
      transform: scale(1.05);
    }

    .btn-play:active {
      transform: scale(0.98);
    }

    /* PLACEHOLDER QUẢNG CÁO TRONG GAME OVER (TỐI ƯU CTR) */
    .ad-in-game {
      width: 100%;
      height: 250px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed #64748b;
      margin: 16px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 12px;
      border-radius: 8px;
    }

    /* BỐ CỤC QUẢNG CÁO FOOTER */
    .ad-banner-bottom {
      width: 100%;
      max-width: 728px;
      height: 90px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 13px;
      margin: 8px 0;
    }

    @media (max-height: 650px) {
      .ad-banner-top, .ad-banner-bottom { display: none; }
      .game-wrapper { height: 100vh; max-height: none; border-radius: 0; }
    }
  </style>
</head>
<body>

  <!-- ADS PLACEHOLDER 1: BANNER TOP (728x90 hoặc 320x50) -->
  <div class="ad-banner-top">
    <span><!-- CHÈN MÃ QUẢNG CÁO GOOGLE ADSENSE / ADSTERRA TẠI ĐÂY --> [QC Top Banner]</span>
  </div>

  <!-- GAME CONTAINER -->
  <div class="game-wrapper" id="gameWrapper">
    <div class="hud">
      <div class="score" id="scoreText">0</div>
      <div class="best-score" id="bestText">Kỷ lục: 0</div>
    </div>

    <!-- START OVERLAY -->
    <div class="overlay" id="startScreen">
      <h1 class="title">BẮN BÓNG 🫧</h1>
      <p class="subtitle">Chạm/Click để nổ bóng!<br>Đừng để bóng trôi chạm vạch trên.</p>
      <button class="btn-play" onclick="startGame()">CHƠI NGAY</button>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div class="overlay hidden" id="gameOverScreen">
      <h2 class="title" style="color: #f43f5e;">THUA RỒI!</h2>
      <p class="subtitle" id="finalScoreText">Điểm của bạn: 0</p>
      
      <!-- ADS PLACEHOLDER 2: RECTANGLE AD (300x250) IN GAME OVER -->
      <div class="ad-in-game">
        <span><!-- CHÈN MÃ QUẢNG CÁO INTERSTITIAL / NATIVE TẠI ĐÂY --> [QC Game Over 300x250]</span>
      </div>

      <button class="btn-play" onclick="startGame()">CHƠI LẠI</button>
    </div>

    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- ADS PLACEHOLDER 3: BANNER BOTTOM -->
  <div class="ad-banner-bottom">
    <span><!-- CHÈN MÃ QUẢNG CÁO TẠI ĐÂY --> [QC Bottom Banner]</span>
  </div>

  <script>
    const CANVAS_WIDTH = 400;
    const CANVAS_HEIGHT = 700;
    const STORAGE_KEY = 'bubble_pop_best_score';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('gameWrapper');

    const scoreText = document.getElementById('scoreText');
    const bestText = document.getElementById('bestText');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreText = document.getElementById('finalScoreText');

    let scale = 1;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0');
    let gameRunning = false;

    let bubbles = [];
    let particles = [];
    let texts = [];
    let spawnTimer = 0;
    let spawnInterval = 60; // Số frame tạo 1 bóng mới
    let combo = 0;

    const COLORS = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#3742fa', '#e84393'];

    bestText.innerText = `Kỷ lục: ${bestScore}`;

    // Tự động resize Canvas theo tỷ lệ DPR (cho nét màn hình Retina/OLED)
    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      scale = window.devicePixelRatio || 1;
      canvas.width = rect.width * scale;
      canvas.height = rect.height * scale;
      ctx.scale(scale, scale);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // LỚP KHỞI TẠO BÓNG
    class Bubble {
      constructor() {
        this.r = 20 + Math.random() * 18;
        this.x = this.r + Math.random() * (wrapper.clientWidth - this.r * 2);
        this.y = wrapper.clientHeight + this.r;
        this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.speed = 1.2 + Math.random() * 1.5 + (score * 0.01); // Nhanh dần theo điểm
        this.wobble = Math.random() * Math.PI * 2;
        this.popped = false;
      }

      update() {
        this.y -= this.speed;
        this.wobble += 0.05;
        this.x += Math.sin(this.wobble) * 0.8;
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        
        // Gradient giúp bóng tròn và bóng bẩy hơn
        let grad = ctx.createRadialGradient(
          this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.1,
          this.x, this.y, this.r
        );
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.2, this.color);
        grad.addColorStop(1, '#000000');

        ctx.fillStyle = grad;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fill();

        // Điểm phản quang trên bóng
        ctx.beginPath();
        ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.fill();

        ctx.restore();
      }
    }

    // HIỆU ỨNG HẠT NỔ (PARTICLES)
    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.r = 2 + Math.random() * 4;
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.1; // Trọng lực nhẹ
        this.alpha -= 0.03;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    // HIỆU ỨNG ĐIỂM BAY (+10, COMBO)
    class FloatingText {
      constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.alpha = 1;
      }

      update() {
        this.y -= 1.5;
        this.alpha -= 0.02;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = 'bold 20px system-ui';
        ctx.fillStyle = this.color;
        ctx.textAlign = 'center';
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
      }
    }

    function popBubble(index, bubble) {
      bubble.popped = true;
      combo++;
      const addedScore = 10 + Math.min(combo, 10) * 2;
      score += addedScore;
      scoreText.innerText = score;

      // Tạo hiệu ứng nổ
      for (let i = 0; i < 12; i++) {
        particles.push(new Particle(bubble.x, bubble.y, bubble.color));
      }

      // Tạo hiệu ứng chữ
      const txt = combo > 2 ? `+${addedScore} (${combo}x)` : `+${addedScore}`;
      texts.push(new FloatingText(bubble.x, bubble.y, txt, combo > 2 ? '#fbbf24' : '#ffffff'));

      bubbles.splice(index, 1);
    }

    // TỰ ĐỘNG XỬ LÝ CHẠM / CLICK
    function handleInput(e) {
      if (!gameRunning) return;

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      let hit = false;
      // Duyệt ngược từ bóng mới nhất (nằm phía trên)
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        const dist = Math.hypot(clickX - b.x, clickY - b.y);

        if (dist < b.r + 10) { // Bán kính bấm rộng hơn 10px để dễ trúng trên mobile
          popBubble(i, b);
          hit = true;
          break;
        }
      }

      if (!hit) {
        combo = 0; // Bấm hụt thì xả Combo
      }
    }

    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleInput(e);
    }, { passive: false });

    function startGame() {
      score = 0;
      combo = 0;
      bubbles = [];
      particles = [];
      texts = [];
      spawnTimer = 0;
      gameRunning = true;

      scoreText.innerText = '0';
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      gameRunning = false;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem(STORAGE_KEY, bestScore);
        bestText.innerText = `Kỷ lục: ${bestScore}`;
      }

      finalScoreText.innerText = `Điểm của bạn: ${score}`;
      gameOverScreen.classList.remove('hidden');
    }

    function gameLoop() {
      if (!gameRunning) return;

      ctx.clearRect(0, 0, wrapper.clientWidth, wrapper.clientHeight);

      // Vẽ vạch nguy hiểm ở cạnh trên
      ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, 50);
      ctx.lineTo(wrapper.clientWidth, 50);
      ctx.stroke();
      ctx.setLineDash([]);

      // Sinh ra bóng mới
      spawnTimer++;
      if (spawnTimer >= Math.max(20, spawnInterval - Math.floor(score / 50))) {
        bubbles.push(new Bubble());
        spawnTimer = 0;
      }

      // Cập nhật & Vẽ Bóng
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.update();
        b.draw();

        // Kiểm tra thua: Bóng chạm mốc nguy hiểm ở trên
        if (b.y - b.r <= 50) {
          gameOver();
          return;
        }
      }

      // Cập nhật & Vẽ Hạt Nổ
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      // Cập nhật & Vẽ Chữ Bay
      for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        t.update();
        t.draw();
        if (t.alpha <= 0) texts.splice(i, 1);
      }

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
