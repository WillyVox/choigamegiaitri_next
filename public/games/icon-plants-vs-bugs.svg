<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pvb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c6b28" />
      <stop offset="1" stop-color="#12200c" />
    </linearGradient>
    <linearGradient id="pvb-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe37a" />
      <stop offset="1" stop-color="#ffb020" />
    </linearGradient>
    <linearGradient id="pvb-center" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2b" />
      <stop offset="1" stop-color="#5a3618" />
    </linearGradient>
    <linearGradient id="pvb-bug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9c5334" />
      <stop offset="1" stop-color="#5d2f16" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#pvb-bg)" />
  <ellipse cx="170" cy="130" rx="150" ry="70" fill="#ffffff" opacity="0.06" />

  <!-- pea motion trail -->
  <path d="M198 244 L296 264 L198 288 Z" fill="#b6ff3c" opacity="0.35" />
  <path d="M228 250 L310 264 L228 278 Z" fill="#b6ff3c" opacity="0.55" />

  <!-- pea projectile -->
  <circle cx="318" cy="264" r="15" fill="#c8ff5e" />
  <circle cx="313" cy="259" r="5" fill="#eaffb0" opacity="0.8" />

  <!-- stem and leaf -->
  <path d="M186 232 L186 356" stroke="#3f7d2c" stroke-width="16" stroke-linecap="round" />
  <path d="M186 292 C 150 286 128 306 118 336 C 156 336 180 320 186 292 Z" fill="#4c9235" />

  <!-- sunflower petals -->
  <g fill="url(#pvb-petal)">
    <ellipse cx="186" cy="112" rx="22" ry="54" />
    <ellipse cx="186" cy="112" rx="22" ry="54" transform="rotate(45 186 176)" />
    <ellipse cx="186" cy="112" rx="22" ry="54" transform="rotate(90 186 176)" />
    <ellipse cx="186" cy="112" rx="22" ry="54" transform="rotate(135 186 176)" />
    <ellipse cx="186" cy="112" rx="22" ry="54" transform="rotate(180 186 176)" />
    <ellipse cx="186" cy="112" rx="22" ry="54" transform="rotate(225 186 176)" />
    <ellipse cx="186" cy="112" rx="22" ry="54" transform="rotate(270 186 176)" />
    <ellipse cx="186" cy="112" rx="22" ry="54" transform="rotate(315 186 176)" />
  </g>

  <!-- sunflower center -->
  <circle cx="186" cy="176" r="46" fill="url(#pvb-center)" />
  <circle cx="172" cy="164" r="6" fill="#c98a3a" opacity="0.6" />
  <circle cx="196" cy="180" r="5" fill="#c98a3a" opacity="0.6" />
  <circle cx="180" cy="192" r="4" fill="#c98a3a" opacity="0.6" />

  <!-- bug legs -->
  <g stroke="#3a1c0d" stroke-width="7" stroke-linecap="round">
    <path d="M312 300 L288 322" />
    <path d="M330 312 L316 336" />
    <path d="M350 312 L360 338" />
    <path d="M368 300 L392 320" />
  </g>

  <!-- bug antennae -->
  <path d="M328 268 L306 240" stroke="#3a1c0d" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M352 268 L374 240" stroke="#3a1c0d" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="304" cy="236" r="6" fill="#3a1c0d" />
  <circle cx="376" cy="236" r="6" fill="#3a1c0d" />

  <!-- bug body -->
  <ellipse cx="340" cy="304" rx="60" ry="42" fill="url(#pvb-bug)" transform="rotate(-8 340 304)" />
  <ellipse cx="340" cy="304" rx="60" ry="42" fill="none" stroke="#2a1408" stroke-width="4" transform="rotate(-8 340 304)" />
  <path d="M340 264 L340 344" stroke="#2a1408" stroke-width="4" transform="rotate(-8 340 304)" />

  <!-- bug head -->
  <circle cx="290" cy="286" r="26" fill="url(#pvb-bug)" />
  <circle cx="282" cy="280" r="5" fill="#ffe37a" />
  <circle cx="298" cy="280" r="5" fill="#ffe37a" />
</svg>
