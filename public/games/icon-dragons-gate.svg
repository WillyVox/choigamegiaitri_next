<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf86"/>
      <stop offset="1" stop-color="#ff6b5b"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#fff0da"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff7e6"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff9d4d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <ellipse cx="176" cy="140" rx="150" ry="70" fill="#ffffff" opacity="0.16"/>

  <!-- torii-style gate -->
  <rect x="120" y="180" width="30" height="220" rx="10" fill="url(#gate)"/>
  <rect x="362" y="180" width="30" height="220" rx="10" fill="url(#gate)"/>
  <rect x="150" y="252" width="212" height="20" rx="8" fill="url(#gate)"/>
  <path d="M96 190 C 160 150, 352 150, 416 190
           C 416 208, 402 214, 386 208
           C 328 176, 184 176, 126 208
           C 110 214, 96 208, 96 190 Z" fill="url(#gate)"/>

  <!-- dragon pearl glowing in the gateway -->
  <circle cx="256" cy="330" r="40" fill="url(#pearl)"/>
  <circle cx="242" cy="316" r="10" fill="#fffdf7" opacity="0.8"/>
