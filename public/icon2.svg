<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe259" />
    </linearGradient>
  </defs>

  <!-- Dark Premium Container -->
  <rect width="512" height="512" rx="112" fill="#0b1026" />

  <!-- Outer Gold Glow Ring -->
  <rect width="464" height="464" x="24" y="24" rx="96" fill="none" stroke="url(#gold-grad)" stroke-width="10" stroke-opacity="0.4" />

  <!-- Controller Body -->
  <path d="M130 160h252c45 0 80 35 80 80 0 65-40 130-90 130-25 0-45-20-60-40h-12c-15 20-35 40-60 40-50 0-90-65-90-130 0-45 35-80 80-80z" fill="#141a36" stroke="url(#gold-grad)" stroke-width="14" />

  <!-- D-Pad Left -->
  <path d="M140 215h20v20h20v20h-20v20h-20v-20h-20v-20h20z" fill="url(#gold-grad)" />

  <!-- Action Buttons Right (Gold & White) -->
  <circle cx="370" cy="225" r="13" fill="#ffffff" />
  <circle cx="345" cy="250" r="13" fill="url(#gold-grad)" />
  <circle cx="395" cy="250" r="13" fill="url(#gold-grad)" />
  <circle cx="370" cy="275" r="13" fill="#ffffff" />

  <!-- Center Play Accent -->
  <polygon points="246,220 280,245 246,270" fill="url(#gold-light)" />
</svg>
